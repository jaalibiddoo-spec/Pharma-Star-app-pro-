    // --- 3D WebGL Canvas Component using Three.js ---
    function MechanismVisualizer3D({ modelType }) {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth || 700;
        const height = 400;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.replaceChildren(renderer.domElement);

        // Lighting
        const keyLight = new THREE.DirectionalLight(0x2dd4bf, 2);
        keyLight.position.set(5, 5, 5);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 1);
        fillLight.position.set(-5, -3, -3);
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
        scene.add(ambientLight);

        const group = new THREE.Group();

        if (modelType === 'gpcr') {
          // 7 Transmembrane Helices
          for (let i = 0; i < 7; i++) {
            const angle = (i / 7) * Math.PI * 2;
            const geo = new THREE.CylinderGeometry(0.2, 0.2, 3.5, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.3 });
            const helix = new THREE.Mesh(geo, mat);
            helix.position.set(Math.cos(angle) * 1.2, 0, Math.sin(angle) * 1.2);
            group.add(helix);
          }
          // Ligand (Propranolol blocker)
          const ligGeo = new THREE.DodecahedronGeometry(0.5);
          const ligMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0x78350f });
          const ligand = new THREE.Mesh(ligGeo, ligMat);
          ligand.position.set(0, 1.2, 0);
          group.add(ligand);
        } else if (modelType === 'acei') {
          // ACE Zinc metalloprotease cleft
          const cleftGeo = new THREE.TorusGeometry(2, 0.6, 16, 32, Math.PI * 1.5);
          const cleftMat = new THREE.MeshStandardMaterial({ color: 0x0f766e, metalness: 0.4 });
          const cleft = new THREE.Mesh(cleftGeo, cleftMat);
          group.add(cleft);

          // Central Zn2+ ion
          const znGeo = new THREE.SphereGeometry(0.4, 24, 24);
          const znMat = new THREE.MeshStandardMaterial({ color: 0xe0e7ff, metalness: 0.9, emissive: 0x6366f1 });
          const zn = new THREE.Mesh(znGeo, znMat);
          group.add(zn);
        } else {
          // Nanocarrier / PBP sphere
          const vesicleGeo = new THREE.SphereGeometry(2, 32, 16, 0, Math.PI * 1.6);
          const vesicleMat = new THREE.MeshStandardMaterial({ color: 0x14b8a6, side: THREE.DoubleSide });
          const vesicle = new THREE.Mesh(vesicleGeo, vesicleMat);
          group.add(vesicle);

          // Drug payload
          for (let j = 0; j < 12; j++) {
            const rod = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            rod.position.set((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);
            group.add(rod);
          }
        }

        scene.add(group);

        let animId;
        const animate = () => {
          group.rotation.y += 0.008;
          renderer.render(scene, camera);
          animId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          renderer.dispose();
        };
      }, [modelType]);

      return (
        <div className="relative w-full h-[400px] rounded-xl overflow-hidden bg-slate-950 border border-slate-800 shadow-xl">
          <div className="absolute top-3 left-3 z-10 bg-slate-900/90 border border-slate-700 px-3 py-1 rounded-lg text-xs font-bold text-teal-400">
            Interactive 3D Molecular Simulation • Three.js WebGL
          </div>
          <div ref={mountRef} className="w-full h-full cursor-grab" />
        </div>
      );
    }

            {/* 1. COURSES TAB */}
            {activeTab === 'courses' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-2xl p-4 h-[600px] overflow-y-auto space-y-2">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">10 Pharmacy Courses</h3>
                  {COURSES_DATA.map(course => (
                    <div
                      key={course.id}
                      onClick={() => setSelectedCourse(course)}
                      className={`p-3 rounded-xl border cursor-pointer transition ${
                        selectedCourse.id === course.id
                          ? 'bg-teal-950/40 border-teal-500 text-white'
                          : 'bg-slate-950 border-slate-800 hover:border-slate-700 text-slate-300'
                      }`}
                    >
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold">{course.title}</span>
                        <span className="text-[10px] text-teal-400 font-mono">{course.code}</span>
                      </div>
                      <p className="text-[11px] text-slate-400 line-clamp-1 mt-1">{course.description}</p>
                    </div>
                  ))}
                </div>

                <div className="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-xs text-teal-400 font-mono font-bold">{selectedCourse.code} • {selectedCourse.duration}</span>
                      <h2 className="text-xl font-bold text-white mt-0.5">{selectedCourse.title}</h2>
                    </div>
                    {selectedCourse.has3D && (
                      <button
                        onClick={() => {
                          setSelected3D(selectedCourse.moaId || 'gpcr');
                          setActiveTab('moa3d');
                        }}
                        className="px-3 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold hover:bg-amber-500/30 transition"
                      >
                        Launch 3D MOA ➔
                      </button>
                    )}
                  </div>

                  <p className="text-xs text-slate-300 leading-relaxed">{selectedCourse.description}</p>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <h4 className="text-xs font-bold text-teal-400 uppercase tracking-wide">
                      {selectedCourse.modules[0]?.title}
                    </h4>
                    <p className="text-xs text-slate-200 leading-relaxed whitespace-pre-line">
                      {selectedCourse.modules[0]?.content}
                    </p>
                  </div>

                  <div className="bg-teal-950/20 border border-teal-500/30 p-4 rounded-xl space-y-2">
                    <span className="text-xs font-bold text-teal-400 uppercase tracking-wide">
                      High-Yield Clinical Pearls for Hospital Rounds:
                    </span>
                    <ul className="space-y-1.5 text-xs text-slate-200">
                      {selectedCourse.modules[0]?.pearls.map((pearl, i) => (
                        <li key={i} className="flex items-start gap-2">
                          <span className="text-teal-400 font-bold">•</span>
                          <span>{pearl}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {/* 2. 3D MOA TAB */}
            {activeTab === 'moa3d' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <div>
                    <h3 className="text-base font-bold text-white">3D Molecular Mechanism of Action Visualizer</h3>
                    <p className="text-xs text-slate-400">Three.js WebGL GPU molecular kinematics</p>
                  </div>

                  <div className="flex gap-2">
                    {[
                      { id: 'gpcr', label: 'GPCR & Beta-Blocker' },
                      { id: 'acei', label: 'ACE Inhibitor & Zinc' },
                      { id: 'ache', label: 'Liposomal Nanocarrier' }
                    ].map(m => (
                      <button
                        key={m.id}
                        onClick={() => setSelected3D(m.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                          selected3D === m.id ? 'bg-teal-600 text-white' : 'bg-slate-800 text-slate-300'
                        }`}
                      >
                        {m.label}
                      </button>
                    ))}
                  </div>
                </div>

                <MechanismVisualizer3D modelType={selected3D} />
              </div>
            )}

            {/* 3. DRUG INTERACTION CHECKER */}
            {activeTab === 'checker' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                  <h3 className="text-base font-bold text-white">Polypharmacy Drug Interaction Checker</h3>
                  <p className="text-xs text-slate-400 mt-1">Cross-examines regimens for pharmacokinetic and hemorrhagic risks.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {DRUG_INTERACTIONS.map((item, idx) => (
                    <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-sm font-bold text-teal-300">{item.drugA} + {item.drugB}</span>
                        <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30">
                          {item.severity}
                        </span>
                      </div>
                      <div className="text-xs space-y-1">
                        <p><strong className="text-slate-400">Mechanism:</strong> <span className="text-slate-300">{item.mechanism}</span></p>
                        <p><strong className="text-rose-400">Clinical Risk:</strong> <span className="text-slate-300">{item.effect}</span></p>
                      </div>
                      <div className="bg-teal-950/20 p-2.5 rounded-xl border border-teal-500/30 text-xs text-emerald-300">
                        <strong>Action:</strong> {item.action}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. LAB & COCKCROFT-GAULT CALCULATOR */}
            {activeTab === 'lab' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                  <h3 className="text-base font-bold text-white">Cockcroft-Gault CrCl Calculator</h3>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Age (Years):</label>
                      <input
                        type="number"
                        value={cgAge}
                        onChange={(e) => setCgAge(Number(e.target.value))}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Weight (kg):</label>
                      <input
                        type="number"
                        value={cgWeight}
                        onChange={(e) => setCgWeight(Number(e.target.value))}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Serum Creatinine (mg/dL):</label>
                      <input
                        type="number"
                        step="0.1"
                        value={cgScr}
                        onChange={(e) => setCgScr(Number(e.target.value))}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Gender:</label>
                      <select
                        value={cgGender}
                        onChange={(e) => setCgGender(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white"
                      >
                        <option value="male">Male</option>
                        <option value="female">Female (0.85x)</option>
                      </select>
                    </div>
                  </div>

                  <div className="p-4 bg-slate-950 rounded-xl border border-teal-500/40 flex justify-between items-center">
                    <div>
                      <span className="text-xs text-slate-400">Calculated Creatinine Clearance:</span>
                      <div className="text-2xl font-bold font-mono text-teal-400">{calculatedCrCl} mL/min</div>
                    </div>
                    <div className="text-xs font-bold text-right">
                      {calculatedCrCl >= 60 ? (
                        <span className="text-emerald-400">Normal / Mild Impairment</span>
                      ) : calculatedCrCl >= 30 ? (
                        <span className="text-amber-400">Moderate Impairment (Dose Adjust!)</span>
                      ) : (
                        <span className="text-rose-400">Severe Renal Impairment</span>
                      )}
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                  <h3 className="text-base font-bold text-white">Core Laboratory Diagnostic Profiles</h3>
                  <div className="space-y-2.5">
                    {LAB_TESTS.map((test, i) => (
                      <div key={i} className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between">
                          <strong className="text-white">{test.name}</strong>
                          <span className="text-teal-400 font-mono">{test.normal}</span>
                        </div>
                        <p className="text-slate-400">{test.elevated}</p>
                        <p className="text-teal-300"><strong>Action:</strong> {test.action}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 5. MEDICATION TRACKER */}
            {activeTab === 'tracker' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h3 className="text-base font-bold text-white">Daily Medication Adherence Schedule</h3>
                    <p className="text-xs text-slate-400">Tap checkboxes to log doses taken today.</p>
                  </div>
                  <div className="bg-slate-950 px-4 py-2 rounded-xl border border-teal-500/40 text-center">
                    <span className="text-[10px] text-slate-400 block">Adherence</span>
                    <span className="text-lg font-bold font-mono text-teal-400">75%</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <h4 className="font-bold text-white">Lisinopril 20 mg</h4>
                    <p className="text-teal-400 font-mono">1 Tab • Morning</p>
                    <label className="flex items-center gap-2 pt-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={medsTaken.med1_morn}
                        onChange={(e) => setMedsTaken({ ...medsTaken, med1_morn: e.target.checked })}
                      />
                      <span>Morning Dose Taken</span>
                    </label>
                  </div>

                  <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <h4 className="font-bold text-white">Carvedilol 12.5 mg</h4>
                    <p className="text-teal-400 font-mono">1 Tab • Twice Daily</p>
                    <label className="flex items-center gap-2 pt-1 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={medsTaken.med2_morn}
                        onChange={(e) => setMedsTaken({ ...medsTaken, med2_morn: e.target.checked })}
                      />
                      <span>Morning Dose Taken</span>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={medsTaken.med1_eve}
                        onChange={(e) => setMedsTaken({ ...medsTaken, med1_eve: e.target.checked })}
                      />
                      <span>Evening Dose Taken</span>
                    </label>
                  </div>

                  <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <h4 className="font-bold text-white">Empagliflozin 10 mg</h4>
                    <p className="text-teal-400 font-mono">1 Tab • Morning</p>
                    <label className="flex items-center gap-2 pt-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={medsTaken.med3_morn}
                        onChange={(e) => setMedsTaken({ ...medsTaken, med3_morn: e.target.checked })}
                      />
                      <span>Morning Dose Taken</span>
                    </label>
                  </div>
                </div>
              </div>
            )}

            {/* 6. LIVE PHARMACIST CHAT */}
            {activeTab === 'chat' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 h-[550px] flex flex-col">
                <div>
                  <h3 className="text-base font-bold text-white">Clinical Pharmacist On-Duty Live Consultation</h3>
                  <p className="text-xs text-slate-400">Lead Specialist: Pharm. Dawid Aliyi, BCPS</p>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs">
                  {chatMessages.map((msg, i) => (
                    <div key={i} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <span className="text-[10px] text-slate-400 mb-0.5">{msg.name}</span>
                      <div className={`p-3 rounded-2xl max-w-[80%] ${
                        msg.sender === 'user' ? 'bg-teal-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendChat()}
                    placeholder="Ask clinical pharmacist about dosing, interactions, or guidelines..."
                    className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-teal-500"
                  />
                  <button
                    onClick={handleSendChat}
                    className="px-5 py-2.5 bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs rounded-xl shadow cursor-pointer"
                  >
                    Send
                  </button>
                </div>
              </div>
            )}

            {/* 7. GUIDELINES */}
            {activeTab === 'guidelines' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {GUIDELINES.map((guide, idx) => (
                  <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2 text-xs">
                    <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                      {guide.category}
                    </span>
                    <h4 className="text-sm font-bold text-white mt-1">{guide.title}</h4>
                    <p className="text-teal-400">{guide.authority}</p>
                    <p className="text-slate-300 leading-relaxed mt-2">{guide.summary}</p>
                  </div>
                ))}
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-auto bg-slate-950 border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-400 space-y-1">
            <p className="font-bold text-slate-200">
              Pharmastar app pro © {new Date().getFullYear()} — Lead Developer: Pharmacist Dawid Aliyi
            </p>
            <p className="text-[11px] text-slate-500">
              Commercial Bank of Ethiopia: 1000262900367 (Dawid Aliyi) • Registration: 100 Birr / $1.00 USD
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
