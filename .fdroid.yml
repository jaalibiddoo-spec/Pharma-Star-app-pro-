Summary: "Clinical pharmacy, 3D molecular mechanics, and drug science suite"
Description: |
  Pharmastar App Pro is a comprehensive pharmaceutical and clinical practice suite
  developed by Pharmacist Dawid Aliyi.

  Features:
  * 10 Core Academic Pharmacy Courses with clinical pearls and syllabi
  * MoH / EFDA Accredited CPD Credit Courses & Assessment Quizzes
  * Real-time 3D Interactive WebGL Molecular Mechanisms of Action (MOA)
  * Polypharmacy Drug Interaction Matrix with CYP450 metabolism profiles
  * Laboratory Result Interpretation & Cockcroft-Gault CrCl Calculator
  * Electronic Patient Records (EPR) and SOAP Clinical Documentation
  * Diurnal Medication Adherence Tracker
  * Ethiopian EFDA, MoH STG, WHO AWaRe, ADA, AHA/ACC Guidelines
  * 6 Languages: English, Amharic, Afaan Oromoo, French, Arabic, Spanish
  * Offline-first storage architecture for remote and rural clinics

